# Database configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=P12R2510;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Preserve table and column names exactly, including uppercase letters
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Keep the existing database schema unchanged and disable automatic execution of schema.sql and data.sql
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Show SQL statements in the console for debugging purposes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
