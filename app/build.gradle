plugins {
    // Apply the application plugin to add support for building a CLI application in Java
    id 'application'

    // Apply the Spring Boot plugin to add support for building Spring applications
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Define the group and version of the project
group = 'br.com.bigois'
version = '0.0.1-SNAPSHOT'

// Apply a specific Java toolchain to ease working on different environments
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


repositories {
    // Use Maven Central for resolving dependencies
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application
    implementation libs.guava

    // Apache POI for XSSFWorkbook (xlsx generation)
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // JSON library for parsing JSON files
    implementation 'org.json:json:20260522'

    // JSON Schema Validator for validating JSON against a schema
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    implementation 'com.networknt:json-schema-validator:3.0.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'

    // Gson library for JSON serialization and deserialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // Spring Boot dependencies for building a Spring application
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
