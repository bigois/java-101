plugins {
    // Apply the application plugin to add support for building a CLI application in Java
    id 'java'

    // Apply the Spring Boot plugin to add support for building Spring applications
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

// Define the group and version of the project
group = 'br.com.bigois'
version = '0.0.1-SNAPSHOT'

// Align direct and transitive dependencies with patched releases
ext['log4j2.version'] = libs.versions.log4j2.get()
ext['jackson-2-bom.version'] = libs.versions.jackson2.bom.get()
ext['jackson-bom.version'] = libs.versions.jackson.bom.get()

// Apply a specific Java toolchain to ease working on different environments
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    // Use Maven Central for resolving dependencies
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher

    // This dependency is used by the application
    implementation libs.guava

    // Apache POI for XSSFWorkbook (xlsx generation)
    runtimeOnly libs.log4j.core
    implementation libs.poi.ooxml

    // JSON library for parsing JSON files
    implementation libs.json

    // JSON Schema Validator for validating JSON against a schema
    implementation libs.json.schema.validator
    implementation libs.jackson.databind

    // Libraries for JSON serialization and deserialization
    implementation libs.gson

    // Spring Boot dependencies for building a Spring application
    implementation libs.spring.boot.starter
    testImplementation libs.spring.boot.starter.test

    // JUnit Platform Launcher for running tests
    testRuntimeOnly libs.junit.platform.launcher

    // Mockito for mocking in tests
    testImplementation libs.mockito.core

    // H2 in-memory database for testing with @DataJpaTest
    testRuntimeOnly libs.h2

    // Eclipse Collections helpers for BigDecimal stream statistics
    implementation libs.eclipse.collections

    // OpenAI Java SDK for interacting with OpenAI APIs
    implementation libs.openai.java

    // Spring Boot Data JPA for database access
    implementation libs.spring.boot.starter.data.jpa
    testImplementation libs.spring.boot.starter.data.jpa.test

    // Database drivers
    runtimeOnly libs.postgresql
    runtimeOnly libs.sqlserver.jdbc

    // Lombok for reducing boilerplate code
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    // Spring Boot Web MVC for building web applications
    implementation libs.spring.boot.starter.webmvc
    testImplementation libs.spring.boot.starter.webmvc.test

    // Spring Boot DevTools for hot reloading during development
    // In IntelliJ IDEA enable:
    // 1. Settings > Build, Execution, Deployment > Compiler > Build project automatically
    // 2. Settings > Advanced Settings > Compiler > Allow auto-make to start even if developed application is currently running
    developmentOnly libs.spring.boot.devtools
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}
