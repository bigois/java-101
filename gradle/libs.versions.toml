[versions]
junit-jupiter = "5.12.1"
log4j2 = "2.26.1"
jackson2-bom = "2.22.3"
jackson-bom = "3.1.8"
spring-boot = "4.1.0"
json-smart = "2.6.1"
spring-data-bom = "2026.0.1"
commons-codec = "1.23.0"
logback = "1.6.6"
tomcat = "11.0.29"
spring-framework = "7.0.9"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.0.3" }
guava = { module = "com.google.guava:guava", version = "33.8.0-jre" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j2" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version = "5.5.1" }
json = { module = "org.json:json", version = "20260719" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version = "3.0.9" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.22.4" }
gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.24.0" }
h2 = { module = "com.h2database:h2", version = "2.4.240" }
eclipse-collections = { module = "org.eclipse.collections:eclipse-collections", version = "13.0.0" }
openai-java = { module = "com.openai:openai-java", version = "4.50.0" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test", version.ref = "spring-boot" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.14" }
sqlserver-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version = "13.6.0.jre11" }
lombok = { module = "org.projectlombok:lombok", version = "1.18.46" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc", version.ref = "spring-boot" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "spring-boot" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
