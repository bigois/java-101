[versions]
junit-jupiter = "5.12.1"
log4j2 = "2.26.1"
jackson2-bom = "2.22.3"
jackson-bom = "3.1.7"
spring-boot = "4.1.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
guava = { module = "com.google.guava:guava", version = "33.4.6-jre" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j2" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version = "5.5.1" }
json = { module = "org.json:json", version = "20260522" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version = "3.0.6" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.22.3" }
gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.24.0" }
h2 = { module = "com.h2database:h2" }
eclipse-collections = { module = "org.eclipse.collections:eclipse-collections", version = "13.0.0" }
openai-java = { module = "com.openai:openai-java", version = "4.50.0" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
postgresql = { module = "org.postgresql:postgresql" }
sqlserver-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc" }
lombok = { module = "org.projectlombok:lombok" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
